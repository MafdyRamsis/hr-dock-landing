# Automatic dependency updates (security): Dependabot opens a PR when a
# library HR Dock uses gets a patched version. CI runs on each PR; merge
# when green. Grouped weekly so it stays a handful of PRs, not dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: [dependencies]
